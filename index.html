<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaTech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">NovaTech</div>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Projects</a>
            <a href="#" class="contact-btn">Contact</a>
        </nav>
    </header>
    <main>

    <section class="hero">

        <div class="hero-content">
            <span class="hero-tag">INNOVATION • TECHNOLOGY • FUTURE</span>

            <h1>
                Building the <span>Future</span><br>
                With Technology
            </h1>

            <p>
                NovaTech creates powerful digital solutions that help
                businesses grow, innovate, and stay ahead in a rapidly
                changing world.
            </p>

            <div class="hero-buttons">
                <a href="#" class="primary-btn">Get Started</a>
                <a href="#" class="secondary-btn">Explore Projects</a>
            </div>
        </div>

        <div class="hero-visual">
            <div class="glow"></div>

            <div class="tech-card">
                <div class="card-top">
                    <span class="dot purple"></span>
                    <span class="dot cyan"></span>
                    <span class="dot white"></span>
                </div>

                <div class="code-line long"></div>
                <div class="code-line medium"></div>
                <div class="code-line short"></div>
                <div class="code-line long"></div>
                <div class="code-line small"></div>

                <div class="circle">
                    <span>NT</span>
                </div>
            </div>
        </div>

    </section>

</main>

</body>
</html>
